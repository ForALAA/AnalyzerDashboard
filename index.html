<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyzer Dashboard</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #06090f 0%, #0d151c 100%);
            --card-bg: rgba(17, 26, 36, 0.75);
            --card-border: rgba(16, 185, 129, 0.15);
            --card-hover-border: rgba(16, 185, 129, 0.5);
            --card-hover-bg: rgba(20, 32, 44, 0.9);
            --primary-color: #10b981;
            --primary-hover: #059669;
            --primary-glow: rgba(16, 185, 129, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --step-bg: rgba(13, 21, 28, 0.7);
            --input-bg: rgba(22, 35, 48, 0.6);
            --border-color: rgba(51, 65, 85, 0.6);
            --danger-color: #f43f5e;
            --badge-bg: rgba(16, 185, 129, 0.12);
            --badge-text: #34d399;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 45px;
            position: relative;
        }

        header h1 {
            margin: 0;
            color: var(--primary-color);
            font-size: 2.5rem;
            letter-spacing: -0.5px;
            text-shadow: 0 0 25px rgba(16, 185, 129, 0.3);
        }

        /* Physics Toggle Button Style */
        .physics-toggle-btn {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 14px;
            font-size: 0.82rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .physics-toggle-btn:hover {
            border-color: var(--primary-color);
            color: var(--text-main);
            background-color: var(--input-bg);
        }

        .physics-toggle-btn.active {
            border-color: var(--primary-color);
            color: var(--badge-text);
            background-color: var(--badge-bg);
        }

        /* Search Section */
        .search-container {
            position: relative;
            margin-bottom: 40px;
        }

        .search-container input {
            width: 100%;
            padding: 18px 20px 18px 54px;
            font-size: 1.1rem;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-main);
            outline: none;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .search-container input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px var(--primary-glow), 0 8px 20px rgba(0, 0, 0, 0.3);
            background-color: var(--input-bg);
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-color);
            font-size: 1.2rem;
            pointer-events: none;
        }

        /* Card Grid Layout */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--card-hover-border);
            background-color: var(--card-hover-bg);
            box-shadow: 0 20px 35px -10px rgba(16, 185, 129, 0.15);
            transition: transform 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .card h3 {
            margin: 0;
            color: var(--primary-color);
            font-size: 1.3rem;
        }

        .temp-badge {
            background-color: var(--badge-bg);
            color: var(--badge-text);
            padding: 5px 12px;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 20px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .step-block {
            background-color: var(--step-bg);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 10px;
            font-size: 0.92rem;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .step-title {
            font-weight: 700;
            color: var(--primary-color);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
            opacity: 0.9;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .detail-row span:first-child {
            color: var(--text-muted);
        }

        .detail-row strong {
            color: var(--text-main);
        }

        .card-actions {
            margin-top: 18px;
            display: flex;
            justify-content: flex-end;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
        }

        /* Input Controls Layout */
        .input-unit-group {
            display: flex;
            gap: 8px;
        }

        .input-unit-group input {
            flex: 2;
        }

        .input-unit-group select {
            flex: 1;
            min-width: 85px;
        }

        /* Action Buttons */
        .btn {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            color: #06090f;
            border: none;
            padding: 14px 28px;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 22px rgba(16, 185, 129, 0.5);
        }

        .btn-delete {
            background-color: rgba(244, 63, 94, 0.12);
            color: var(--danger-color);
            border: 1px solid rgba(244, 63, 94, 0.3);
            padding: 6px 14px;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-delete:hover {
            background-color: var(--danger-color);
            color: white;
        }

        /* High-Performance Physics Ball */
        #fabBtn {
            position: fixed;
            top: 0;
            left: 0;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            color: #06090f;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
            z-index: 1000;
            touch-action: none;
            will-change: transform;
        }

        #fabBtn:active {
            cursor: grabbing;
        }

        /* Collapsible Form Section */
        .form-section {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 0 35px;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            margin-top: 0;
            border: none;
            transition: max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease, margin 0.3s ease;
        }

        .form-section.show {
            max-height: 1200px;
            opacity: 1;
            padding: 35px;
            border: 1px solid var(--card-border);
            margin-top: 20px;
        }

        .form-section h2 {
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 1.4rem;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 14px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        input[type="text"], select {
            padding: 13px 16px;
            font-size: 0.98rem;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            outline: none;
            width: 100%;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        select option {
            background-color: #111a24;
            color: var(--text-main);
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .hidden {
            display: none !important;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-muted);
            padding: 50px;
            font-style: italic;
            background-color: var(--card-bg);
            border-radius: 16px;
            border: 1px dashed var(--border-color);
        }
    </style>
</head>
<body>

<!-- Physics Bouncing Ball Button -->
<button id="fabBtn" title="Throw me around or click to open form!">➕</button>

<div class="container">
    <header>
        <h1>🔬 Analyzer Dashboard</h1>
        <!-- Toggle button to disable physics and bouncing -->
        <button id="physicsToggleBtn" class="physics-toggle-btn active" onclick="togglePhysics()">🛑 Disable Physics</button>
    </header>

    <!-- Search Bar -->
    <div class="search-container">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search by test name (e.g., Glycemia, Creatinine, Urea)..." onkeyup="filterProtocols()">
    </div>

    <!-- Protocols Grid -->
    <div class="card-grid" id="protocolContainer"></div>

    <!-- Add Custom Protocol Form -->
    <div class="form-section" id="formSection">
        <h2>Add New Assay Protocol</h2>
        <form id="protocolForm" onsubmit="addProtocol(event)">
            <div class="form-grid">
                <div class="form-group">
                    <label for="testName">Test Name</label>
                    <input type="text" id="testName" required placeholder="e.g., Glycemia (Glucose)">
                </div>
                <div class="form-group">
                    <label for="temp">Temperature</label>
                    <input type="text" id="temp" required placeholder="e.g., 37°C">
                </div>

                <div class="form-group full-width">
                    <label for="mixOrder">Assay / Reagent Mixing Type</label>
                    <select id="mixOrder" onchange="handleMixOrderChange()">
                        <option value="single">Single Reagent (R1 Only)</option>
                        <option value="r1_sample_r2">R1 + Sample ➔ Incubation ➔ R2 (Standard)</option>
                        <option value="r1_r2_sample">R1 + R2 Mixed First ➔ Sample ➔ Incubation</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="r1Val">Reagent 1 (R1) Quantity</label>
                    <div class="input-unit-group">
                        <input type="text" id="r1Val" required placeholder="e.g., 250">
                        <select id="r1Unit">
                            <option value="µL">µL</option><option value="mL">mL</option><option value="drops">drops</option><option value="µg">µg</option><option value="mg">mg</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group r2-group hidden">
                    <label for="r2Val">Reagent 2 (R2) Quantity</label>
                    <div class="input-unit-group">
                        <input type="text" id="r2Val" placeholder="e.g., 50">
                        <select id="r2Unit">
                            <option value="µL">µL</option><option value="mL">mL</option><option value="drops">drops</option><option value="µg">µg</option><option value="mg">mg</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="sampleVal">Sample Plasma / Serum Quantity</label>
                    <div class="input-unit-group">
                        <input type="text" id="sampleVal" required placeholder="e.g., 2.5">
                        <select id="sampleUnit">
                            <option value="µL">µL</option><option value="mL">mL</option><option value="drops">drops</option>
                        </select>
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="incubation1">Incubation / Reaction Timing Details</label>
                    <input type="text" id="incubation1" required placeholder="e.g., 10 min at 37°C or Read at 505nm">
                </div>
            </div>
            <button type="submit" class="btn"><span>💾 Save Protocol</span></button>
        </form>
    </div>
</div>

<script>
    const defaultProtocols = [
        {
            id: 1,
            testName: "Glycemia (Glucose - GOD-PAP)",
            temp: "37°C",
            mixOrder: "single",
            r1Details: "250 µL",
            r2Details: "",
            sampleDetails: "2.5 µL Plasma",
            incubation1: "10 Minutes at 37°C / Read at 505nm"
        },
        {
            id: 2,
            testName: "Creatinine (Jaffe Kinetic)",
            temp: "37°C",
            mixOrder: "r1_sample_r2",
            r1Details: "200 µL (Buffer)",
            r2Details: "50 µL (Picric Acid)",
            sampleDetails: "20 µL Plasma/Serum",
            incubation1: "Incubate 30s, then add R2 & read delta A up to 90s"
        },
        {
            id: 3,
            testName: "Working Reagent Assay (R1+R2 First)",
            temp: "37°C",
            mixOrder: "r1_r2_sample",
            r1Details: "1000 µL (R1)",
            r2Details: "250 µL (R2)",
            sampleDetails: "25 µL Plasma",
            incubation1: "Mix R1 + R2 first, add plasma, incubate 5 min at 37°C"
        }
    ];

    let protocols = JSON.parse(localStorage.getItem('lab_analyzer_dash_v1')) || defaultProtocols;

    // Physics Controller State
    let physicsEnabled = true;

    function togglePhysics() {
        physicsEnabled = !physicsEnabled;
        const toggleBtn = document.getElementById('physicsToggleBtn');
        
        if (physicsEnabled) {
            toggleBtn.innerHTML = "🛑 Disable Physics";
            toggleBtn.classList.add("active");
            fab.style.cursor = "grab";
            updateBallPosition();
        } else {
            toggleBtn.innerHTML = "✨ Enable Physics";
            toggleBtn.classList.remove("active");
            fab.style.cursor = "pointer";
            // Reset position to default corner when physics are turned off
            posX = 20;
            posY = 20;
            fab.style.transform = `translate3d(${posX}px, ${posY}px, 0)`;
        }
    }

    // Advanced Momentum Throw Physics Ball
    const fab = document.getElementById('fabBtn');
    let posX = 60, posY = 80;
    let velX = 0, velY = 0;
    let isDragging = false;
    let hasMoved = false;
    let lastMouseX = 0, lastMouseY = 0;
    let lastTime = performance.now();
    let velocityBuffer = [];

    fab.addEventListener('mousedown', (e) => {
        if (!physicsEnabled) return; // Ignore dragging if physics are disabled
        isDragging = true;
        hasMoved = false;
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
        velX = 0;
        velY = 0;
        velocityBuffer = [];
        lastTime = performance.now();
        e.preventDefault();
    });

    window.addEventListener('mousemove', (e) => {
        if (!physicsEnabled || !isDragging) return;
        
        const currentTime = performance.now();
        const dt = Math.max((currentTime - lastTime) / 1000, 0.001); 
        lastTime = currentTime;

        const dx = e.clientX - lastMouseX;
        const dy = e.clientY - lastMouseY;

        if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
            hasMoved = true;
        }

        posX += dx;
        posY += dy;

        const instantVelX = dx / dt;
        const instantVelY = dy / dt;

        velocityBuffer.push({ x: instantVelX, y: instantVelY });
        if (velocityBuffer.length > 5) {
            velocityBuffer.shift();
        }

        lastMouseX = e.clientX;
        lastMouseY = e.clientY;

        updateBallPosition();
    });

    window.addEventListener('mouseup', () => {
        if (!isDragging) return;
        isDragging = false;

        if (!hasMoved) {
            toggleForm();
        } else if (physicsEnabled && velocityBuffer.length > 0) {
            let avgX = 0;
            let avgY = 0;
            for (let i = 0; i < velocityBuffer.length; i++) {
                avgX += velocityBuffer[i].x;
                avgY += velocityBuffer[i].y;
            }
            velX = (avgX / velocityBuffer.length) * 0.8;
            velY = (avgY / velocityBuffer.length) * 0.8;
        }
    });

    // Simple click handler when physics are disabled
    fab.addEventListener('click', () => {
        if (!physicsEnabled) {
            toggleForm();
        }
    });

    function updateBallPosition() {
        if (!physicsEnabled) return;
        const maxLeft = window.innerWidth - fab.offsetWidth;
        const maxTop = window.innerHeight - fab.offsetHeight;
        posX = Math.max(0, Math.min(posX, maxLeft));
        posY = Math.max(0, Math.min(posY, maxTop));
        
        fab.style.transform = `translate3d(${posX}px, ${posY}px, 0)`;
    }

    let lastFrameTime = performance.now();
    function physicsLoop(currentTime) {
        const dt = Math.min((currentTime - lastFrameTime) / 1000, 0.1);
        lastFrameTime = currentTime;

        if (physicsEnabled && !isDragging) {
            velY += 800 * dt; 
            velX *= 0.985; 
            velY *= 0.985;

            posX += velX * dt;
            posY += velY * dt;

            const maxLeft = window.innerWidth - fab.offsetWidth;
            const maxTop = window.innerHeight - fab.offsetHeight;

            if (posY >= maxTop) {
                posY = maxTop;
                velY = -velY * 0.75; 
                velX *= 0.85;
            }
            if (posY <= 0) {
                posY = 0;
                velY = -velY * 0.75;
            }
            if (posX >= maxLeft) {
                posX = maxLeft;
                velX = -velX * 0.75;
            }
            if (posX <= 0) {
                posX = 0;
                velX = -velX * 0.75;
            }

            updateBallPosition();
        }

        requestAnimationFrame(physicsLoop);
    }
    requestAnimationFrame(physicsLoop);

    function toggleForm() {
        const formSection = document.getElementById('formSection');
        formSection.classList.toggle('show');
        
        if (formSection.classList.contains('show')) {
            fab.innerHTML = '✖';
            formSection.scrollIntoView({ behavior: 'smooth' });
        } else {
            fab.innerHTML = '➕';
        }
    }

    function handleMixOrderChange() {
        const order = document.getElementById('mixOrder').value;
        const r2Group = document.querySelector('.r2-group');
        const r2Val = document.getElementById('r2Val');

        if (order === 'single') {
            r2Group.classList.add('hidden');
            r2Val.removeAttribute('required');
            r2Val.value = '';
        } else {
            r2Group.classList.remove('hidden');
            r2Val.setAttribute('required', 'true');
        }
    }

    function renderProtocols(data) {
        const container = document.getElementById('protocolContainer');
        container.innerHTML = '';

        if (data.length === 0) {
            container.innerHTML = `<div class="no-results">No matching protocols found. Click or throw the bouncing ➕ ball to create one!</div>`;
            return;
        }

        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            
            let mixingStepsHTML = '';
            if (item.mixOrder === 'single') {
                mixingStepsHTML = `<div class="step-block"><div class="step-title">Assay Procedure</div><div class="detail-row"><span>Reagent (R1):</span> <strong>${item.r1Details}</strong></div><div class="detail-row"><span>Sample (Plasma):</span> <strong>${item.sampleDetails}</strong></div></div>`;
            } else if (item.mixOrder === 'r1_sample_r2') {
                mixingStepsHTML = `<div class="step-block"><div class="step-title">Step 1: Initial Addition</div><div class="detail-row"><span>R1 Reagent:</span> <strong>${item.r1Details}</strong></div><div class="detail-row"><span>Sample (Plasma):</span> <strong>${item.sampleDetails}</strong></div></div><div class="step-block"><div class="step-title">Step 2: Secondary Addition</div><div class="detail-row"><span>R2 Reagent:</span> <strong>${item.r2Details}</strong></div></div>`;
            } else if (item.mixOrder === 'r1_r2_sample') {
                mixingStepsHTML = `<div class="step-block"><div class="step-title">Step 1: Working Reagent Mix</div><div class="detail-row"><span>R1 Reagent:</span> <strong>${item.r1Details}</strong></div><div class="detail-row"><span>R2 Reagent:</span> <strong>${item.r2Details}</strong></div></div><div class="step-block"><div class="step-title">Step 2: Sample Addition</div><div class="detail-row"><span>Sample (Plasma):</span> <strong>${item.sampleDetails}</strong></div></div>`;
            }

            card.innerHTML = `
                <div>
                    <div class="card-header">
                        <h3>${item.testName}</h3>
                        <span class="temp-badge">${item.temp}</span>
                    </div>
                    ${mixingStepsHTML}
                    <div class="step-block">
                        <div class="step-title">Incubation / Reading</div>
                        <div style="color: var(--text-main); font-weight: 500;">${item.incubation1}</div>
                    </div>
                </div>
                <div class="card-actions">
                    <button class="btn-delete" onclick="deleteProtocol(${item.id})">🗑️ Delete</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function filterProtocols() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = protocols.filter(item => 
            item.testName.toLowerCase().includes(query) || 
            item.r1Details.toLowerCase().includes(query) ||
            item.r2Details.toLowerCase().includes(query)
        );
        renderProtocols(filtered);
    }

    function addProtocol(e) {
        e.preventDefault();
        const mixOrder = document.getElementById('mixOrder').value;
        const r1Details = `${document.getElementById('r1Val').value.trim()} ${document.getElementById('r1Unit').value}`;
        let r2Details = mixOrder !== 'single' ? `${document.getElementById('r2Val').value.trim()} ${document.getElementById('r2Unit').value}` : "";
        const sampleDetails = `${document.getElementById('sampleVal').value.trim()} ${document.getElementById('sampleUnit').value} Plasma`;

        const newProtocol = {
            id: Date.now(),
            testName: document.getElementById('testName').value,
            temp: document.getElementById('temp').value,
            mixOrder: mixOrder,
            r1Details: r1Details,
            r2Details: r2Details,
            sampleDetails: sampleDetails,
            incubation1: document.getElementById('incubation1').value
        };

        protocols.push(newProtocol);
        localStorage.setItem('lab_analyzer_dash_v1', JSON.stringify(protocols));
        
        document.getElementById('protocolForm').reset();
        handleMixOrderChange(); 
        toggleForm();
        renderProtocols(protocols);
    }

    function deleteProtocol(id) {
        if(confirm("Are you sure you want to delete this assay protocol?")) {
            protocols = protocols.filter(item => item.id !== id);
            localStorage.setItem('lab_analyzer_dash_v1', JSON.stringify(protocols));
            renderProtocols(protocols);
        }
    }

    handleMixOrderChange();
    renderProtocols(protocols);
    updateBallPosition();
</script>

</body>
